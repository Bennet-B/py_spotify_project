[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-project"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# Only relaxation: spotipy ships inline type annotations but no .pyi
# stub files, so pyright surfaces a "missing stub" warning for the
# import itself. Spotipy's inline annotations are then used normally.
# Every other strict report stays on; per-line `# pyright: ignore[
# reportXXX]` is the way to handle individual unfixable cases.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
